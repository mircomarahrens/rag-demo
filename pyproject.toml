[project]
name = "rag-demo"
version = "0.1"
description = ""
authors = [{ name = "Mirco Marahrens", email = "mirco.marahrens@googlemail.com" }]
requires-python = "~=3.10"
readme = "README.md"
dependencies = [
    "numpy>=1.26.2,<2",
    "pandas>=2.1.3,<3",
    "requests>=2.31.0,<3",
    "torch==2.1.0",
    "bitsandbytes>=0.41.2.post2,<0.42",
    "accelerate>=0.24.1,<0.25",
    "transformers>=4.35.2,<5",
    "peft>=0.6.2,<0.7",
    "scipy>=1.11.4,<2",
    "langchain>=0.0.340,<0.0.341",
    "playwright>=1.40.0,<2",
    "html2text>=2020.1.16,<2021",
    "sentence-transformers>=2.2.2,<3",
    "faiss-gpu>=1.7.2,<2",
    "nvidia-ml-py3>=7.352.0,<8",
    "pypdf>=3.17.1,<4",
    "pdfminer-six>=20221105,<20221106",
    "einops>=0.7.0,<0.8",
    "datasets>=2.15.0,<3",
]

[dependency-groups]
dev = [
    "ipykernel>=6.26.0,<7",
    "ipywidgets>=8.1.1,<9",
    "pre-commit>=3.5.0,<4",
    "black>=23.11.0,<24",
    "notebook>=7.0.6,<8",
    "jupyterlab>=4.0.9,<5",
    "jupyterlab-rise>=0.41.0,<0.42",
]
frontend = ["streamlit>=1.28.2,<2"]
s2t = [
    "einops>=0.7.0,<0.8",
    "datasets>=2.15.0,<3",
    "soundfile>=0.12.1,<0.13",
    "pydub>=0.25.1,<0.26",
    "librosa>=0.10.1,<0.11",
]

[tool.uv]
default-groups = [
    "dev",
    "frontend",
    "s2t",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
